name: Build for Windows

on:
  workflow_call:
    inputs:
      output-artifact-name:
        description: Name of artifact as which Windows executable to be uploaded
        required: true
        type: string
      version:
        description: Version to replace with
        required: false
        type: string
jobs:
  build-windows:
    name: Build Windows executable
    runs-on: windows-latest
    steps:
      - name: Install Conan
        run: pip3 install --break-system-packages conan==2.17.0

      - uses: actions/checkout@v6

      - name: Replace version
        if: ${{ inputs.version != '' }}
        uses: ./.github/actions/replace-version
        with:
          version: ${{ inputs.version }}

      # rlottie forces the MSVC-only /MT flag on Windows, so build with MSVC (cl) instead of the runner's MinGW gcc
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      # Force an MSVC profile: conan's auto-detect picks up MinGW gcc from PATH. Ninja avoids VS-version generator mismatch.
      - name: Create conan profile
        shell: bash
        run: |
          conan profile detect --force >/dev/null 2>&1 || true
          cat > "$(conan profile path default)" <<'EOF'
          [settings]
          arch=x86_64
          build_type=Release
          compiler=msvc
          compiler.cppstd=17
          compiler.runtime=static
          compiler.version=194
          os=Windows
          [conf]
          tools.cmake.cmaketoolchain:generator=Ninja
          tools.microsoft.msbuild:vs_version=18
          EOF

      - name: Install conan dependencies
        run: conan install . --build=missing -s build_type=Release

      - name: Invoke 'conan-release' preset
        shell: bash
        run: cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DLOTTIE_MODULE=OFF --preset conan-release

      - name: Build the app
        shell: bash
        run: cmake --build --preset conan-release

      - name: Upload executable as artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ inputs.output-artifact-name }}
          path: bin/lottie_to_png.exe

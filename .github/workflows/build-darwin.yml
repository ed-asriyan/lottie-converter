name: Build for Darwin

on:
  workflow_call:
    inputs:
      output-artifact-name:
        description: Name of artifact as which Darwin executable to be uploaded
        required: true
        type: string
      arch:
        description: "amd64 or arm64" 
        required: true
        type: string
      version:
        description: Version to replace with
        required: false
        type: string

jobs:
  build-darwin:
    name: Build MacOS executable
    runs-on: ${{ inputs.arch == 'arm64' && 'macos-26' || 'macos-15-intel' }}
    steps:
      - name: Install Conan
        run: pip3 install --break-system-packages conan==2.17.0

      - uses: actions/checkout@v6

      - name: Replace version
        if: ${{ inputs.version != '' }}
        uses: ./.github/actions/replace-version
        with:
          version: ${{ inputs.version }}

      - name: Detect conan profile
        run: conan profile detect

      - name: Update Conan settings for Apple Clang 21
        run: |
          python3 << 'SCRIPT'
          path = '.conan2/settings.yml'
          with open(path) as f:
              lines = f.readlines()
          in_apple_clang = False
          updated = []
          for line in lines:
              if line.strip().startswith('apple-clang:'):
                  in_apple_clang = True
              if in_apple_clang and 'version:' in line and '[' in line and '"21"' not in line:
                  line = line.rstrip()
                  if line.endswith(']'):
                      line = line[:-1] + ', "21"]\n'
                  in_apple_clang = False
              updated.append(line)
          with open(path, 'w') as f:
              f.writelines(updated)
          SCRIPT

      - name: Install conan dependencies
        run: conan install . --build=missing -s build_type=Release

      - name: Invoke 'conan-release' preset
        run: cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 --preset conan-release

      - name: Build the app
        run: cmake -DCMAKE_BUILD_TYPE=Release -DLOTTIE_MODULE=OFF CMakeLists.txt && cmake --build . --config Release

      - name: Upload executable as artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ inputs.output-artifact-name }}
          path: bin/lottie_to_png

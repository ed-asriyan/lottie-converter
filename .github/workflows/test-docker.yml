name: Test in Docker

on:
  workflow_call:
    inputs:
      arch:
        description: "amd64 or arm64" 
        required: true
        type: string
      output-artifact-name:
        description: Name of artifact as which Docker test results to be uploaded
        required: true
        type: string

permissions:
  contents: read

jobs:
  test-docker:
    name: Run docker tests 
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - apng
          - gif
          - png
          - webp
          - webm
        background:
          - ""
          - "rgb(255,255,255)"
          - "#FF0000"
          - "rgba(0,0,255,128)"
    steps:
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Download ${{ matrix.image }} image artifact
      uses: actions/download-artifact@v8.0.1
      with:
        name: docker-image-lottie-to-${{ matrix.image }}-${{ inputs.arch }}
        path: ${{ runner.temp }}

    - name: Load ${{ matrix.image }} image
      run: docker load -i ${{ runner.temp }}/lottie-to-${{ matrix.image }}-${{ inputs.arch }}.tar

    - uses: actions/checkout@v7

    - name: Run tests
      run: docker run --rm -v $(pwd)/test-files:/source ${{ matrix.background != '' && format('-e BACKGROUND=''{0}''', matrix.background) || '' }} --platform ${{ inputs.arch }} lottie-to-${{ matrix.image }}:${{ inputs.arch }}

    - name: Generate background suffix
      id: bg-suffix
      uses: ./.github/actions/background-suffix
      with:
        background: ${{ matrix.background }}

    - name: Upload test results as artifacts
      uses: actions/upload-artifact@v7.0.1
      with:
        name: ${{ inputs.output-artifact-name }}.${{ matrix.image }}${{ steps.bg-suffix.outputs.suffix }}
        path: test-files

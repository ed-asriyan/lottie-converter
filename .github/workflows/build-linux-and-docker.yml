name: Build for Linux & Docker

on:
  workflow_call:
    inputs:
      output-artifact-name:
        description: Name of artifact as which Docker image to be uploaded
        required: true
        type: string
      arch:
        description: "amd64 or arm64" 
        required: true
        type: string
      version:
        description: Version to replace with
        required: false
        type: string

jobs:
  build-docker:
    name: Build linux and docker images
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: 1
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Replace version
        if: ${{ inputs.version != '' }}
        uses: ./.github/actions/replace-version
        with:
          version: ${{ inputs.version }}

      - name: Build lottie-to-apng
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: lottie-to-apng:${{ inputs.arch }}
          platforms: ${{ inputs.arch }}
          target: lottie-to-apng
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save lottie-to-apng image
        run: docker save lottie-to-apng:${{ inputs.arch }} -o ${{ runner.temp }}/lottie-to-apng-${{ inputs.arch }}.tar

      - name: Upload lottie-to-apng as artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: docker-image-lottie-to-apng-${{ inputs.arch }}
          path: ${{ runner.temp }}/lottie-to-apng-${{ inputs.arch }}.tar

      - name: Build lottie-to-gif
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: lottie-to-gif:${{ inputs.arch }}
          platforms: ${{ inputs.arch }}
          target: lottie-to-gif
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save lottie-to-gif image
        run: docker save lottie-to-gif:${{ inputs.arch }} -o ${{ runner.temp }}/lottie-to-gif-${{ inputs.arch }}.tar

      - name: Upload lottie-to-gif as artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: docker-image-lottie-to-gif-${{ inputs.arch }}
          path: ${{ runner.temp }}/lottie-to-gif-${{ inputs.arch }}.tar

      - name: Build lottie-to-png
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: lottie-to-png:${{ inputs.arch }}
          platforms: ${{ inputs.arch }}
          target: lottie-to-png
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save lottie-to-png image
        run: docker save lottie-to-png:${{ inputs.arch }} -o ${{ runner.temp }}/lottie-to-png-${{ inputs.arch }}.tar

      - name: Upload lottie-to-png as artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: docker-image-lottie-to-png-${{ inputs.arch }}
          path: ${{ runner.temp }}/lottie-to-png-${{ inputs.arch }}.tar

      - name: Build lottie-to-webp
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: lottie-to-webp:${{ inputs.arch }}
          platforms: ${{ inputs.arch }}
          target: lottie-to-webp
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save lottie-to-webp image
        run: docker save lottie-to-webp:${{ inputs.arch }} -o ${{ runner.temp }}/lottie-to-webp-${{ inputs.arch }}.tar

      - name: Upload lottie-to-webp as artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: docker-image-lottie-to-webp-${{ inputs.arch }}
          path: ${{ runner.temp }}/lottie-to-webp-${{ inputs.arch }}.tar

      - name: Build lottie-to-webm
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: lottie-to-webm:${{ inputs.arch }}
          platforms: ${{ inputs.arch }}
          target: lottie-to-webm
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save lottie-to-webm image
        run: docker save lottie-to-webm:${{ inputs.arch }} -o ${{ runner.temp }}/lottie-to-webm-${{ inputs.arch }}.tar

      - name: Upload lottie-to-webm as artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: docker-image-lottie-to-webm-${{ inputs.arch }}
          path: ${{ runner.temp }}/lottie-to-webm-${{ inputs.arch }}.tar

      - name: Extract executable
        run: |
          id=$(docker create lottie-to-png:${{ inputs.arch }}) &&
          docker cp $id:/usr/bin/lottie_to_png bin/ &&
          docker rm -v $id

      - name: Upload executable as artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ inputs.output-artifact-name }}
          path: bin/lottie_to_png

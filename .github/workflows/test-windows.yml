name: Tes in Windows

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      input-artifact-name:
        description: Name of artifact as which Windows executable is uploaded
        required: true
        type: string
      output-artifact-name:
        description: Name of artifact as which Windows test results to be uploaded
        required: true
        type: string

jobs:
  test-windows:
    name: Test Windows
    runs-on: windows-latest
    strategy:
      matrix:
        case:
          - apng
          - gif
          - png
          - webm
        background:
          - ""
          - "rgb(255,255,255)"
          - "#FF0000"
          - "rgba(0,0,255,128)"
    steps:
      - uses: actions/checkout@v4

      - name: Install giffki
        if: ${{ matrix.case == 'gif' }}
        shell: bash
        run: cargo install gifski

      - name: Install ffmpeg
        if: ${{ (matrix.case == 'apng') || (matrix.case == 'webm') }}
        uses: FedericoCarboni/setup-ffmpeg@v2

      - name: Download artifact
        uses: actions/download-artifact@v4.1.7
        with:
          name: ${{ inputs.input-artifact-name }}
          path: bin

      - name: Run tests
        shell: bash
        env:
          BACKGROUND_COLOR: ${{ matrix.background }}
        run: |
          find test-files -type f \( -iname \*.json -o -iname \*.lottie -o -iname \*.tgs \) | while IFS=$'\n' read -r FILE; do
            if [ -n "$BACKGROUND_COLOR" ]; then
              echo "Converting ${FILE} with background ${BACKGROUND_COLOR}..." && sh ./bin/lottie_to_${{ matrix.case }}.sh --background "$BACKGROUND_COLOR" "$FILE" && echo Done.
            else
              echo "Converting ${FILE}..." && sh ./bin/lottie_to_${{ matrix.case }}.sh "$FILE" && echo Done.
            fi
          done

      - name: Generate background suffix
        id: bg-suffix
        uses: ./.github/actions/background-suffix
        with:
          background: ${{ matrix.background }}

      - name: Upload test results as artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{inputs.output-artifact-name }}.${{ matrix.case }}${{ steps.bg-suffix.outputs.suffix }}
          path: test-files
